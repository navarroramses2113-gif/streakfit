  <!-- getforja.app/install: the Home Screen steps as a page to send people
       (beta testers, the bio link). The same steps as the app's
       (home-screen-guide.js). Adding THIS page to the Home Screen must add
       the app: the manifest's start_url is the app, the icon is named
       Forja, and opened from the Home Screen it goes straight in. -->
  <script>
    try {
      if (navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches) location.replace("index.html");
      if (localStorage.getItem("forja-theme") === "light") document.documentElement.setAttribute("data-theme", "light");
    } catch (e) {}
  </script>

  <script src="i18n.js?v=2"></script>

  <script src="home-screen-guide.js?v=1"></script>
  <script>
    (function () {
      const logo = '<div class="brand"><svg class="brand-logo" viewBox="0 0 367 110" role="img" aria-label="Forja"><use href="#forja-lockup"/></svg></div>';
      const box = document.getElementById("install-guide");
      const draw = () => (box.innerHTML = ForjaHomeGuide.html({ top: logo }));
      draw();
      box.addEventListener("click", (event) => ForjaHomeGuide.click(event, draw));
      // Set here, not in the tag: Netlify rewrites href="index.html" to "/",
      // which is the front page, not the app (fixed the same way on landing.html).
      const open = document.getElementById("install-open-app");
      open.href = "index.html";
      open.textContent = tr("Open Forja in {browser} instead", { browser: ForjaHomeGuide.browserName() });
      document.title = tr("Forja: add it to your Home Screen");
    })();
  </script>
